[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "blender-mcp-connect"
version = "0.1.0"
description = "MCP server for Blender with automatic local instance discovery (unofficial downstream of Blender Lab MCP)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "marble810" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
]
dependencies = [
    "docutils",
    "mcp[cli]>=1.2.0,<2",
    "pyyaml",
]

[project.urls]
Homepage = "https://github.com/marble810/blender-mcp-connect"
Repository = "https://github.com/marble810/blender-mcp-connect"
Issues = "https://github.com/marble810/blender-mcp-connect/issues"
Changelog = "https://github.com/marble810/blender-mcp-connect/blob/main/CHANGELOG.md"
Upstream = "https://projects.blender.org/lab/blender_mcp"

[project.scripts]
blender-mcp-connect = "blmcp:main"

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
"blmcp" = [
    # MCP prompt definitions.
    "data/prompts.yml",
    # Blender Python API reference.
    "data/api/**/*.rst",
    # Blender user manual.
    "data/manual/**/*.rst",
]

[tool.mypy]
mypy_path = "stubs"

[[tool.mypy.overrides]]
module = [
    "blmcp", "blmcp.*",
    "blender_mcp_addon", "blender_mcp_addon.*",
]
strict = true

[[tool.mypy.overrides]]
module = [
    "bpy", "bpy.*",
    "mcp", "mcp.*",
]
ignore_missing_imports = true

[tool.ruff]
extend-exclude = ["blmcp/data"]

[tool.ruff.lint]
ignore = [
    # Don't suggest f-string.
    # Why disable? Personal preference.
    "UP032",
    # Do not catch blind exception: `Exception`.
    # Why disable? There are times we *need* to be generic.
    "BLE001",
    # Combine `if` statements using `and`.
    # Why disable? Makes the code more dense and difficult to refator (at times).
    "SIM102",
    # Combine `if` branches using logical `or` operator.
    # Why disable? Code may be grouped in ways that make sense conceptually.
    "SIM114",
    # `__slots__` is not sorted.
    # Why disable? Slots are often grouped logically, matching `__init__`, sometimes using groups.
    "RUF023",
]

[tool.pylint.format]
max-line-length = 120

[tool.autopep8]
max_line_length = 120
ignore = [
    "E721",
    "E722",
    "E402",
    "W690",
]
aggressive = 2

