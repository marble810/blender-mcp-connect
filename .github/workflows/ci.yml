name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }} / py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "mcp[cli]>=1.2,<2" pyyaml docutils
          python -m pip install pytest

      - name: Run unit tests
        shell: bash
        run: |
          python -m pytest tests/test_rst_parse.py tests/test_rst_search.py \
            tests/test_mcp_server.py tests/test_instance_registry.py \
            tests/test_connection.py tests/test_addon_server_e2e.py \
            tests/test_packaging.py -q

  build:
    name: build wheel/sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build and check
        shell: bash
        run: |
          python -m pip install --upgrade pip build twine
          python -m build ./mcp --outdir dist
          python -m twine check dist/*
          python - <<'PY'
          import zipfile, glob
          wheel = glob.glob("dist/*.whl")[0]
          with zipfile.ZipFile(wheel) as zf:
              names = set(zf.namelist())
              assert "blmcp/__init__.py" in names, "blmcp package missing"
              assert any(n.startswith("blmcp/data/prompts.yml") for n in names), "prompts missing"
              assert any(n.startswith("blmcp/data/manual/") for n in names), "manual data missing"
              assert any(n.startswith("blmcp/data/api/") for n in names), "api data missing"
              ep = [n for n in names if n.endswith("entry_points.txt")][0]
              assert "blender-mcp-connect = blmcp:main" in zf.read(ep).decode(), "entry point missing"
          print("wheel contents OK")
          PY
